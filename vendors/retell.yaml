vendor: retell
verified_date: "2026-10-14"   # create: block live-verified via
                              # scripts/verify_vendor_adapters.py --vendor retell

dial:
  method: register_call
  register_url: "https://api.retellai.com/v2/register-phone-call"
  sip_host: "sip.retellai.com"
  ttl_seconds: 300   # must dial within 5 minutes of registering

auth:
  api_key_env: RETELL_API_KEY
  agent_id_env: RETELL_AGENT_ID

connect_timeout_s: 10

codecs: [PCMU, PCMA, G722]

concurrency:
  default: 20
  tier: pay-as-you-go
  raise_by: "$8/concurrency/month; enterprise uncapped"
  burst: "min(3x limit, limit+300) at +$0.10/min"

notes: >
  call_id from register-phone-call is single-use - re-register per call,
  never reuse. Retell blocks calls the instant balance hits $0 (set
  auto-recharge). A free trial with no card on file leaves the call stuck at
  call_status=registered, disconnection_reason=null, pure silence - looks
  like a SIP bug, is actually billing (error string: "Trial over quota,
  please add payment.").

# Phase 7 - agent creation. Retell is a two-resource flow: a "Retell LLM"
# first, then an agent referencing it via response_engine. LIVE-VERIFIED
# 2026-10-14: scripts/verify_vendor_adapters.py --vendor retell - full
# create/get/delete round trip (both the agent and its llm resource),
# name/language/voice all confirmed to round-trip.
create:
  llm_endpoint: "https://api.retellai.com/create-retell-llm"
  llm_delete_endpoint: "https://api.retellai.com/delete-retell-llm/{llm_id}"
  endpoint: "https://api.retellai.com/create-agent"
  get_endpoint: "https://api.retellai.com/get-agent/{agent_id}"
  # A SEPARATE endpoint from get_endpoint - unlike Telnyx/ElevenLabs, Retell's
  # API does not accept PATCH on the GET resource URL (confirmed live:
  # PATCH get-agent/{id} returns a 404 "Cannot PATCH /get-agent/...", which
  # crashed every real Retell pilot call before dialing even started).
  # PATCH update-agent/{id} is the real, confirmed-working endpoint.
  update_endpoint: "https://api.retellai.com/update-agent/{agent_id}"
  delete_endpoint: "https://api.retellai.com/delete-agent/{agent_id}"
  voice_field_path: "voice_id"   # confirmed live
  languages:
    en-US: {code: "en-US"}
    en-SG: {code: null, fallback: ["en-US"]}
    hi-IN: {code: "hi-IN"}
    es-ES: {code: "es-ES"}
    id-ID: {code: "id-ID"}
  asr:
    language_field_path: "language"
    stt_provider_field_path: "custom_stt_config.provider"
