vendor: telnyx
verified_date: "2026-10-14"

dial:
  method: static_uri_via_texml_lookup
  uri_template: "sip:{user}@{sip_subdomain}.sip.telnyx.com"
  user: probe
  assistant_id: "assistant-6bc7551f-cb18-4118-974d-9a13dd4dee1c"
  # sip_subdomain is NOT guessable from the assistant id alone in general -
  # resolved at dial time via two read-only (free) API calls:
  #   GET /v2/ai/assistants/{assistant_id}
  #     -> telephony_settings.default_texml_app_id
  #   GET /v2/texml_applications/{app_id}
  #     -> data.inbound.sip_subdomain
  # It happened to equal the assistant_id in this verified case only because
  # Telnyx auto-named the TeXML app "ai-assistant-{assistant_id}" - do not
  # assume that equality holds for a renamed or manually-created app.

auth:
  api_key_env: TELNYX_API_KEY   # only used for the sip_subdomain lookup above
  method: none                 # the TeXML app's sip_subdomain_receive_settings
                                # is "from_anyone" - no SIP auth needed to dial

connect_timeout_s: 10

codecs: [OPUS, AMR-WB, G722, G711A, G711U]

concurrency:
  trial: 2
  after_level2_verification: 10
  rate_limit: "CPS: first 5 free, then $12-30/CPS"

recordings:
  enabled_by_default: true   # telephony_settings.recording_settings on the
                              # assistant itself (dual-channel mp3)
  api: "GET /v2/recordings"
  note: "download_urls are presigned S3 links, expire in 10 minutes - refetch, never bookmark"

notes: >
  No documented direct "dial sip:xxx@sip.telnyx.com into an assistant"
  pattern in Telnyx's own docs or portal UI - discovered via the assistant's
  own API record, not the Connections page (which only shows generic SIP/
  voice connections, not AI Assistant calls - those are a separate
  record_type=ai-voice-assistant CDR category entirely).

# Phase 7 - agent creation. LIVE-VERIFIED 2026-10-14 using the native voice
# path (scripts/verify_vendor_adapters.py --vendor telnyx - full create/get/
# delete round trip, name/language/voice all confirmed to round-trip).
# Also supports BYOK ElevenLabs voices (voice format
# "elevenlabs.<model>.<VoiceId>" + an api_key_ref integration secret, both
# creatable via API) - written and wired per Telnyx's own docs, but a real
# create call 400'd even with the secret's correct UUID id as api_key_ref
# ("Voice settings API key ... not found"). Telnyx's own ElevenLabs
# integration docs note a premium ElevenLabs account is required (freemium
# not supported) - plausible but unconfirmed root cause. See
# vendors/create.py's telnyx_create_agent(use_byok_voice=...) docstring -
# defaults to the native voice until this is resolved.
create:
  endpoint: "https://api.telnyx.com/v2/ai/assistants"
  get_endpoint: "https://api.telnyx.com/v2/ai/assistants/{agent_id}"
  delete_endpoint: "https://api.telnyx.com/v2/ai/assistants/{agent_id}"
  voice_field_path: "voice_settings.voice"   # confirmed live - see
                                              # "Telnyx.Ultra.f786b574-..." on
                                              # the real existing assistant
  # CONFIRMED LIVE (2026-10-14): the default transcription model
  # (deepgram/flux) requires a BARE ISO-639 code, not a BCP-47 region
  # variant - a live create call with "en-US" 400'd with "language must be
  # one of: auto, de, en, es, fr, hi, it, ja, multi, nl, pt, ru. Got: en-US".
  # That same list also CONFIRMS id-ID (Indonesian) is simply absent from
  # deepgram/flux's supported languages - not merely undocumented as
  # previously noted, genuinely unsupported by this transcription model.
  # A different transcription.model (among Telnyx's 14 options, per
  # docs/vendors.md) might support it - not probed yet, left as a fallback
  # gap rather than guessed.
  languages:
    en-US: {code: "en"}
    en-SG: {code: null, fallback: ["en-US"]}
    hi-IN: {code: "hi"}
    es-ES: {code: "es"}
    id-ID: {code: null, fallback: []}   # genuinely unsupported by
                                        # deepgram/flux - see comment above
  transcription:
    model_field_path: "transcription.model"
    language_field_path: "transcription.language"
    default_model: "deepgram/flux"   # confirmed live as the create endpoint's
                                      # own default when transcription.model
                                      # is omitted
    id_ID_model: null   # which (if any) of the other 13 transcription.model
                        # options supports Indonesian - not probed yet

  # voice_settings.language_boost - CONFIRMED LIVE (2026-10-22) this is a
  # SEPARATE field from transcription.language, and matters a lot more than
  # its name suggests: the live test assistant was found with
  # transcription.language correctly set to "hi" (an earlier fix, see
  # vendors/create.py's set_agent_language() docstring) but language_boost
  # still stuck on its creation-time default "English" - which actively
  # biases the TTS's pronunciation/decoding toward English regardless of
  # what script the LLM's response text is in. Confirmed on a real hi-IN
  # call this combination (STT correctly set, TTS boost left on English)
  # produced heavy English/Hindi code-switching that our own forced-Hindi
  # ASR then transliterated into unmatchable phonetic Devanagari
  # ("पॉन नंबर टू रीच यू आट" for "phone number to reach you at"), silently
  # routing a perfectly normal, correctly-understood-by-a-human question to
  # the adaptive LLM fallback. Values are full capitalized English language
  # names, not ISO codes - "Hindi" and "Spanish" both round-tripped via a
  # free PATCH+GET verification call, no live phone call involved. Also
  # confirmed live: the PATCH endpoint requires voice_settings.voice to be
  # present alongside language_boost (a general "resending this nested
  # object requires its own required field" rule, not a "send everything or
  # nothing" rule - every other voice_settings field not included in the
  # PATCH body round-tripped untouched).
  language_boost_names:
    en: "English"
    hi: "Hindi"
    es: "Spanish"
