vendor: pipecat
verified_date: "2026-09"   # docs/vendors.md's own research date

# Structurally absent, not just undocumented - no SIP stack at all, and no
# HTTP creation API. scripts/run_caller.py's --vendor choices (sourced from
# known_vendors(), i.e. every vendors/*.yaml present) WOULD include pipecat
# if dial were set to anything but null - keeping both null and loud here
# means picking --vendor pipecat fails immediately with a clear reason
# instead of silently hanging on a call that was never going to connect.

dial: null
dial_unsupported_reason: >
  No SIP stack at all - terminates via Daily/Twilio/Telnyx instead
  (docs/vendors.md). Auth inherits whichever of those providers is used.

create: null
create_unsupported_reason: >
  No HTTP create-agent endpoint. Python config set at deploy time via a
  Language enum (281 codes), not an API call - vendors/create.py raises
  VendorCreateError for this vendor instead of faking success.

concurrency:
  per_deployment: 50   # docs contradict a separate "unlimited" pricing claim

notes: >
  Pipecat Cloud has ~10s cold start polluting latency unless
  --min-agents >= 1 (which bills 24/7) - docs/vendors.md billing trap.
  Getting this vendor working at all is a bigger lift than the other six:
  it needs an actual cloud agent deployment decision plus a SIP-capable
  transport provider choice (Daily/Twilio/Telnyx), not just a config file -
  flagged as a follow-up, not attempted in Phase 7.
