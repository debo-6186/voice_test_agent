vendor: vapi
verified_date: "2026-09"   # docs/vendors.md's own research date - dial/create
                            # not yet live-verified against this project's
                            # own account (VAPI_API_KEY empty in .env)
status: not_live_verified

dial:
  method: static_uri
  uri_template: "sip:{name}@sip.vapi.ai"   # EU: sip.eu.vapi.ai, not modeled yet
  name: probe

auth:
  method: none   # docs state no auth or SIP registration required for dial-in
  api_key_env: VAPI_API_KEY   # used for the create: endpoints below, not dial

connect_timeout_s: 10

codecs: []   # not documented - determine empirically (docs/vendors.md)

concurrency:
  tiers:
    usage_only: 4
    core_29: 10
    pro_999_min: 30
  raise_by: "$10/line/month add-on"
  note: "concurrency is per-subscription, shared across all organizations - cannot multiply by creating orgs"

create:
  endpoint: "https://api.vapi.ai/assistant"
  get_endpoint: "https://api.vapi.ai/assistant/{agent_id}"
  delete_endpoint: "https://api.vapi.ai/assistant/{agent_id}"
  languages:
    en-US: {code: "en"}
    en-SG: {code: null, fallback: ["en-US"]}
    hi-IN: {code: "hi"}
    es-ES: {code: "es"}
    id-ID: {code: "id"}
  transcriber:
    language_field_path: "transcriber.language"
    note: >
      Auto-detect needs Deepgram multi, Gladia, or AssemblyAI - not modeled,
      a single language per transcriber is assumed here.

notes: >
  Free tier is 4 concurrent - buy $10/line add-ons rather than the $999/mo
  Pro tier (docs/vendors.md billing trap). vendors/create.py's
  vapi_create_agent() is written against documented payload shapes but has
  never been called against a real key - treat its field names as
  unconfirmed until VAPI_API_KEY is set and
  scripts/verify_vendor_adapters.py --vendor vapi passes.
