[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polycall-bench"
version = "0.1.0"
description = "PolyCall Bench - voice-AI degradation benchmark"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "PyYAML>=6.0",
]

[tool.setuptools]
packages = ["vqlab", "vqlab.fx", "sip_probe"]
