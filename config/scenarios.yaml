        text_norm:
          en-US: "hi there yes my name is rachel hoffman and i'm calling today about the appointment that was scheduled for earlier this week"
          en-SG: "hi there yes my name is tan wei ming and i'm calling today about the appointment that was scheduled for earlier this week lah"
          hi-IN: "नमस्ते हां मेरा नाम प्रिया शर्मा है और मैं अपनी उस अपॉइंटमेंट के बारे में कॉल कर रही हूँ जो इस हफ्ते तय हुई थी"
          es-ES: "hola si me llamo carlos jimenez y estoy llamando por la cita que se programo a principios de esta semana"
          id-ID: "halo iya nama saya budi santoso saya telepon soal jadwal appointment saya yang sudah dijadwalkan dari minggu ini"
        entities:
          en-US: [{type: person_name, value: "Rachel Hoffman"}]
          en-SG: [{type: person_name, value: "Tan Wei Ming"}]
          hi-IN: [{type: person_name, value: "प्रिया शर्मा", romanised: "Priya Sharma"}]
