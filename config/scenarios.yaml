        entities:
          en-US: [{type: date, value: "--10-15"}]
          en-SG: [{type: date, value: "--10-15"}]
          hi-IN: [{type: date, value: "--10-15"}]
          es-ES: [{type: date, value: "--10-15"}]
          id-ID: [{type: date, value: "--10-15"}]

  # Phase 6 verification-only throwaway: same three fields as S3, but asked
  # in a different order (phone, then date, then name). Proves the caller
  # reacts to classified intent rather than scenario file order - the actual
  # point of Phase 6, since our own mock agent otherwise always asks in the
  # same name->phone->date order every time. en-US only; not part of the
  # published corpus.
  S3_reordered_test:
    label: "Verification only - same fields as S3, asked phone/date/name"
    turns:
      - id: turn_phone
        field: phone
        gap_before_s: 4.0
        text:
          en-US: "Hi there, yes, I'd like to leave my callback number, it's nine one four, two three three, zero eight seven seven, if that's alright."
        text_norm:
          en-US: "hi there yes i'd like to leave my callback number it's 9142330877 if that's alright"
        entities:
          en-US: [{type: phone, value: "9142330877", digits: 10}]
      - id: turn_date
        field: date
        gap_before_s: 7.0
        text:
          en-US: "And I would like to book the appointment for the fifteenth of October, if that date is open."
        text_norm:
          en-US: "and i would like to book the appointment for the 15th of october if that date is open"
        entities:
          en-US: [{type: date, value: "--10-15"}]
      - id: turn_name
        field: person_name
        gap_before_s: 8.0
        text:
          en-US: "And just so you have it, my name is Rachel Hoffman, calling about that same appointment."
        text_norm:
          en-US: "and just so you have it my name is rachel hoffman calling about that same appointment"
        entities:
          en-US: [{type: person_name, value: "Rachel Hoffman"}]
