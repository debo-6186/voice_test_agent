          es-ES: "Hola, sí, me llamo Carlos Jiménez, y estoy llamando por la cita que se programó a principios de esta semana."
          id-ID: "Halo, iya, nama saya Budi Santoso, saya telepon soal jadwal appointment saya yang sudah dijadwalkan dari minggu ini."
        text_norm:
          en-US: "hi there yes my name is rachel hoffman and i'm calling today about the appointment that was scheduled for earlier this week"
          en-SG: "hi there yes my name is tan wei ming and i'm calling today about the appointment that was scheduled for earlier this week lah"
          hi-IN: "नमस्ते हां मेरा नाम प्रिया शर्मा है और मैं अपनी उस अपॉइंटमेंट के बारे में कॉल कर रही हूँ जो इस हफ्ते तय हुई थी"
          es-ES: "hola si me llamo carlos jimenez y estoy llamando por la cita que se programo a principios de esta semana"
          id-ID: "halo iya nama saya budi santoso saya telepon soal jadwal appointment saya yang sudah dijadwalkan dari minggu ini"
        entities:
          en-US: [{type: person_name, value: "Rachel Hoffman"}]
          en-SG: [{type: person_name, value: "Tan Wei Ming"}]
          hi-IN: [{type: person_name, value: "प्रिया शर्मा", romanised: "Priya Sharma"}]
          es-ES: [{type: person_name, value: "Carlos Jiménez"}]
          id-ID: [{type: person_name, value: "Budi Santoso"}]
      - id: turn_phone
        field: phone
        gap_before_s: 7.0
        text:
          en-US: "And my callback number is nine one four, two three three, zero eight seven seven, in case we get cut off halfway through the call."
          en-SG: "And my handphone number is nine one two three, four five six seven, just in case we get cut off halfway through the call."
          hi-IN: "और मेरा नंबर है नौ आठ सात छह पाँच चार तीन दो एक शून्य, ताकि अगर बीच में कॉल कट जाए तो आप वापस कॉल कर सकें।"
          es-ES: "Y mi número es seis uno cuatro, dos tres tres, cero ocho siete, por si se corta la llamada a mitad de camino."
          id-ID: "Dan nomor saya nol delapan satu dua, tiga empat lima enam, tujuh delapan sembilan, kalau-kalau teleponnya putus di tengah-tengah pembicaraan."
        text_norm:
          en-US: "and my callback number is 9142330877 in case we get cut off halfway through the call"
          en-SG: "and my handphone number is 91234567 just in case we get cut off halfway through the call"
          hi-IN: "और मेरा नंबर है 9876543210 ताकि अगर बीच में कॉल कट जाए तो आप वापस कॉल कर सकें"
          es-ES: "y mi numero es 614233087 por si se corta la llamada a mitad de camino"
          id-ID: "dan nomor saya 08123456789 kalau-kalau teleponnya putus di tengah-tengah pembicaraan"
        entities:
          en-US: [{type: phone, value: "9142330877", digits: 10}]
          en-SG: [{type: phone, value: "91234567", digits: 8, format: sg_mobile}]
          hi-IN: [{type: phone, value: "9876543210", digits: 10, format: in_mobile}]
          es-ES: [{type: phone, value: "614233087", digits: 9, format: es_mobile}]
          id-ID: [{type: phone, value: "08123456789", digits: 11, format: id_mobile}]

  S3_name_phone_date:
    label: "Linked three-field - name, phone, date (the compounding case)"
    turns:
      - id: turn_name
        field: person_name
        gap_before_s: 4.0
