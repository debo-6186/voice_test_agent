# PolyCall Bench - multi-turn scenario definitions (PLAN.md Phase 4 / S1-S3).
#
# Entity chains mirror tau-Elicitation's structure (PLAN.md S6) so the
# compounding-error curve is directly comparable: S1 one field, S2 two linked
# fields, S3 three linked fields. S4 (staged validation) is deferred - it
# needs runtime branching that belongs with the Phase 6 caller state machine,
# not a static corpus.
#
# Turn text is written as a natural conversational line, not a terse
# form-field readout - a clipped "My name is Rachel Hoffman." is only ~1.4s
# of real speech, which barely gives a live agent (or its own VAD/turn
# detection) room to register the turn. Measured at ~2.9 words/sec on the
# project's ElevenLabs voices, so every turn below targets 18+ words to
# clear 5s of real speech with margin, not just by padding silence.
#
# gap_before_s is the nominal assumed offset from the end of the PREVIOUS
# caller turn (standing in for the agent's expected question/response) - it
# only exists to lay turns onto one timeline so the noise bed can be sliced
# deterministically. It is not a claim about real-time timing; the Phase 6
# state machine decides when to actually play each turn live.
#
# Entity values for name/phone reuse config/utterances.yaml's existing
# ground truth per language so the project has one consistent fact per
# entity, not two. turn_date is new content, following the same "--MM-DD"
# convention as the existing es-ES date entity.
version: 1

scenarios:
  S1_phone_only:
    label: "Single field - phone number only"
    turns:
      - id: turn_phone
        field: phone
        gap_before_s: 4.0
        text:
          en-US: "Hi there, yes, I'd like to leave my phone number, it's nine one four, two three three, zero eight seven seven, thank you."
          en-SG: "Hi there, yes, I want to give you my handphone number, it's nine one two three, four five six seven, thank you lah."
          hi-IN: "नमस्ते, हां, मैं अपना नंबर देना चाहती हूँ, वह है नौ आठ सात छह पाँच चार तीन दो एक शून्य, धन्यवाद।"
          es-ES: "Hola, sí, quiero dejarle mi número de teléfono, es el seis uno cuatro, dos tres tres, cero ocho siete, muchas gracias."
          id-ID: "Halo, iya, saya mau kasih nomor telepon saya, nomornya nol delapan satu dua, tiga empat lima enam, tujuh delapan sembilan, terima kasih."
        text_norm:
          en-US: "hi there yes i'd like to leave my phone number it's 9142330877 thank you"
          en-SG: "hi there yes i want to give you my handphone number it's 91234567 thank you lah"
          hi-IN: "नमस्ते हां मैं अपना नंबर देना चाहती हूँ वह है 9876543210 धन्यवाद"
          es-ES: "hola si quiero dejarle mi numero de telefono es el 614233087 muchas gracias"
          id-ID: "halo iya saya mau kasih nomor telepon saya nomornya 08123456789 terima kasih"
        entities:
          en-US: [{type: phone, value: "9142330877", digits: 10}]
          en-SG: [{type: phone, value: "91234567", digits: 8, format: sg_mobile}]
          hi-IN: [{type: phone, value: "9876543210", digits: 10, format: in_mobile}]
          es-ES: [{type: phone, value: "614233087", digits: 9, format: es_mobile}]
          id-ID: [{type: phone, value: "08123456789", digits: 11, format: id_mobile}]

  S2_name_phone:
    label: "Linked two-field - name then phone"
    turns:
      - id: turn_name
        field: person_name
        gap_before_s: 4.0
        text:
          en-US: "Hi there, yes, my name is Rachel Hoffman, and I'm calling today about the appointment that was scheduled for earlier this week."
          en-SG: "Hi there, yes, my name is Tan Wei Ming, and I'm calling today about the appointment that was scheduled for earlier this week lah."
